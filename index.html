<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Xem poster hướng dẫn BHXH/VssID và quét mã QR tới đường dẫn chính thức."
    />
    <meta name="theme-color" content="#eef5fb" />
    <title>Hướng dẫn BHXH số</title>
  </head>
  <body>
    <main class="customer-shell">
      <header class="customer-header">
        <a class="brand" href="./" aria-label="Trang hướng dẫn">
          <span class="brand-mark" aria-hidden="true">i</span>
          <span>Hướng dẫn <strong>BHXH số</strong></span>
        </a>
      </header>

      <section class="customer-content" aria-labelledby="page-title">
        <div class="customer-intro">
          <p class="eyebrow">THÔNG TIN HƯỚNG DẪN</p>
          <h1 id="page-title">Quét mã QR để xem hướng dẫn</h1>
          <p>Đưa camera điện thoại vào mã QR trên poster để mở trang chủ chính thức của Bảo hiểm xã hội Việt Nam.</p>
        </div>

        <div class="poster-stage">
          <div class="poster-canvas" id="poster-canvas">
            <img
              class="poster-template"
              id="poster-template"
              src="/telegram-qr/bhxh-guide-template.png"
              alt="Poster hướng dẫn đăng ký tài khoản BHXH và VssID"
            />
            <img class="poster-qr" id="poster-qr" alt="Mã QR dẫn tới trang hướng dẫn chính thức" hidden />
          </div>
        </div>

        <div class="customer-actions">
          <p class="status-message" id="status-message" role="status">Đang tải poster hướng dẫn…</p>
          <p class="destination-note" id="destination-note" hidden></p>
          <button class="download-button" id="download-button" type="button" disabled>
            <span aria-hidden="true">↓</span> Tải poster PNG
          </button>
          <p class="safety-note">
            Đây là trang hướng dẫn độc lập. Hãy kiểm tra tên miền chính thức trước khi quét mã.
          </p>
        </div>
      </section>
    </main>
    <script type="module" src="/src/customer.js"></script>
  </body>
</html>
